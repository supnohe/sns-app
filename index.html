<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNSマーケ AI動画分析ナレッジツール</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f0f2f5; padding: 30px 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 680px; }
    .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); margin-bottom: 20px; }
    h2 { color: #1a1a1a; font-size: 18px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; margin-top: 0; }
    
    .auth-card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); text-align: center; }
    .auth-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #f8fafc; padding: 10px 15px; border-radius: 8px; border: 1px solid #e2e8f0; }

    .account-dashboard { background: linear-gradient(135deg, #1e293b, #0f172a); color: white; padding: 25px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
    .account-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .account-name { font-size: 20px; font-weight: bold; color: #38bdf8; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; text-align: center; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; }
    .stat-label { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .stat-value { font-size: 18px; font-weight: bold; color: #ffffff; }

    .input-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
    .input-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 13px; color: #444; }
    input[type="file"], input[type="text"], input[type="number"], input[type="email"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; background: #fafafa; font-size: 14px; }
    button { background: #0066ff; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 15px; width: 100%; font-weight: bold; transition: background 0.2s; }
    button:hover { background: #0052cc; }
    button.sub-btn { background: #28a745; margin-top: 5px; }
    button.sub-btn:hover { background: #218838; }
    button.acc-btn { background: #6366f1; }
    button.acc-btn:hover { background: #4f46e5; }
    button.logout-btn { background: #ef4444; padding: 6px 12px; font-size: 12px; width: auto; }
    button.logout-btn:hover { background: #dc2626; }
    .divider { margin: 15px 0; text-align: center; color: #888; font-size: 12px; font-weight: bold; }
    .result { margin-top: 20px; padding: 20px; background: #ffffff; border: 1px solid #e1e8ed; border-radius: 12px; display: none; line-height: 1.8; color: #333; }
    .advice-content { white-space: pre-wrap; word-break: break-word; font-size: 15px; }
  </style>
</head>
<body>

<div class="container">

  <!-- 🔒 ログイン・新規登録画面 (未ログイン時のみ表示) -->
  <div id="authSection" class="auth-card">
    <h2 style="border:none;">🔑 ログイン / アカウント作成</h2>
    <div style="text-align:left; margin-top:15px;">
      <div class="input-group">
        <label>メールアドレス</label>
        <input type="email" id="authEmail" placeholder="example@email.com">
      </div>
      <div class="input-group">
        <label>パスワード</label>
        <input type="password" id="authPassword" placeholder="6文字以上">
      </div>
      <div style="display:flex; gap:10px; margin-top:15px;">
        <button onclick="handleSignIn()">ログイン</button>
        <button onclick="handleSignUp()" class="sub-btn">新規登録</button>
      </div>
      <p id="authStatus" style="font-size:13px; color:#ef4444; margin-top:10px; text-align:center;"></p>
    </div>
  </div>

  <!-- 🚀 メインコンテンツ (ログイン時のみ表示) -->
  <div id="appSection" style="display: none;">

    <div class="auth-header">
      <span style="font-size:13px; color:#475569;">👤 ログイン中: <strong id="userEmailDisplay">-</strong></span>
      <button class="logout-btn" onclick="handleSignOut()">ログアウト</button>
    </div>

    <!-- 0. 自分のTikTokアカウント情報エリア -->
    <div class="account-dashboard">
      <div class="account-header">
        <div>👤 自分のアカウントデータ</div>
        <div id="accUsername" class="account-name">未設定</div>
      </div>

      <div class="stats-grid">
        <div>
          <div class="stat-label">フォロワー数</div>
          <div id="accFollowers" class="stat-value">-</div>
        </div>
        <div>
          <div class="stat-label">総いいね数</div>
          <div id="accLikes" class="stat-value">-</div>
        </div>
        <div>
          <div class="stat-label">公開動画数</div>
          <div id="accVideos" class="stat-value">-</div>
        </div>
      </div>

      <div style="margin-top: 15px; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px;">
        <div style="font-size:12px; margin-bottom:8px; color:#cbd5e1;">🔗 TikTokアカウントURL</div>
        <input type="text" id="inAccUrl" placeholder="https://www.tiktok.com/@supnohe?is_from_webapp=1&sender_device=pc" style="font-size:13px; padding:8px;">
        
        <div style="font-size:12px; margin-top:10px; margin-bottom:6px; color:#cbd5e1;">📊 アカウントの数値データ（直接入力）</div>
        <div class="input-grid">
          <input type="number" id="inFollowers" placeholder="フォロワー数">
          <input type="number" id="inLikes" placeholder="総いいね数">
          <input type="number" id="inVideos" placeholder="動画数">
        </div>
        <button class="acc-btn" style="margin-top:10px; padding:8px 15px; font-size:13px;" onclick="saveAccountData()">アカウントURL・数値を保存・反映</button>
        <p id="accStatus" style="font-size:12px; color:#38bdf8; margin-top:6px; margin-bottom:0;"></p>
      </div>
    </div>

    <!-- 1. 参考動画のナレッジ登録エリア -->
    <div class="card">
      <h2>📥 1. 参考バズ動画のナレッジ登録</h2>
      
      <div class="input-group">
        <label>🎥 参考動画ファイル（.mp4）をAIに直接見せる【おすすめ】</label>
        <input type="file" id="refVideoFile" accept="video/*">
        <button class="sub-btn" style="margin-top:8px;" onclick="addVideoFileKnowledge()">動画ファイルからAI視覚解析・ナレッジ蓄積！</button>
      </div>

      <div class="divider">── または ──</div>

      <div class="input-group">
        <label>🔗 TikTok動画のURLから登録</label>
        <input type="text" id="tiktokUrl" placeholder="https://www.tiktok.com/@.../video/...">
        <button class="sub-btn" style="margin-top:8px; background:#17a2b8;" onclick="addTikTokKnowledge()">URLからテキストナレッジ蓄積</button>
      </div>

      <p id="refStatus" style="font-size:13px; color:#666; margin-top:8px;"></p>
    </div>

    <!-- 2. 自分の動画の診断エリア -->
    <div class="card">
      <h2>🎥 2. 自分の動画を診断（蓄積データと比較）</h2>
      <div class="input-group">
        <label>自分の動画（診断用）を選択</label>
        <input type="file" id="myVideo" accept="video/*">
      </div>
      <button onclick="analyzeMyVideo()">蓄積ナレッジをもとにAI改善分析スタート！</button>

      <div id="resultBox" class="result">
        <h3 style="margin-top:0; color:#0066ff;">💡 AI改善診断レポート</h3>
        <div id="adviceText" class="advice-content">分析中...</div>
      </div>
    </div>

  </div>

</div>

<script>
  const SUPABASE_URL = "https://kbklsruhvltokvtizzcl.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtia2xzcnVodmx0b2t2dGl6emNsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwOTUyNDIsImV4cCI6MjEwMjY3MTI0Mn0.Q4HRm9pVF0XyAGHgv-7UQEjenSIr1gofWuTLAUY2bEI";
  const GEMINI_API_KEY = "AQ.Ab8RN6JxcEckLGVY0XYscek7ms4DVnZMBlM3g01Cs28yVzZhSw";
  const RAPID_API_KEY = "d5d83e4fa6msh08478310af3bfcfp150258jsnf9ffe2098b50";

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let currentUser = null;

  // 初期化時にログイン状態をチェック
  window.onload = async function() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      currentUser = session.user;
      showAppScreen();
    } else {
      showAuthScreen();
    }
  };

  function showAuthScreen() {
    document.getElementById('authSection').style.display = 'block';
    document.getElementById('appSection').style.display = 'none';
  }

  function showAppScreen() {
    document.getElementById('authSection').style.display = 'none';
    document.getElementById('appSection').style.display = 'block';
    document.getElementById('userEmailDisplay').innerText = currentUser.email;

    // ユーザー別のLocalStorage設定呼び出し
    const saved = JSON.parse(localStorage.getItem(`my_tiktok_acc_${currentUser.id}`) || '{}');
    if (saved.url) document.getElementById('inAccUrl').value = saved.url;
    if (saved.followers) document.getElementById('inFollowers').value = saved.followers;
    if (saved.likes) document.getElementById('inLikes').value = saved.likes;
    if (saved.videos) document.getElementById('inVideos').value = saved.videos;

    if (saved.username) {
      document.getElementById('accUsername').innerText = saved.username;
      document.getElementById('accFollowers').innerText = Number(saved.followers || 0).toLocaleString();
      document.getElementById('accLikes').innerText = Number(saved.likes || 0).toLocaleString();
      document.getElementById('accVideos').innerText = Number(saved.videos || 0).toLocaleString();
    }
  }

  // 🔑 認証処理 (新規登録)
  async function handleSignUp() {
    const email = document.getElementById('authEmail').value;
    const password = document.getElementById('authPassword').value;
    const status = document.getElementById('authStatus');

    if (!email || !password) return alert('メールアドレスとパスワードを入力してください');

    const { data, error } = await supabaseClient.auth.signUp({ email, password });
    if (error) {
      status.innerText = "❌ 登録エラー: " + error.message;
    } else {
      alert("✅ 登録が完了しました！メールが送信された場合は確認してログインしてください。");
    }
  }

  // 🔑 認証処理 (ログイン)
  async function handleSignIn() {
    const email = document.getElementById('authEmail').value;
    const password = document.getElementById('authPassword').value;
    const status = document.getElementById('authStatus');

    if (!email || !password) return alert('メールアドレスとパスワードを入力してください');

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      status.innerText = "❌ ログインエラー: " + error.message;
    } else {
      currentUser = data.user;
      showAppScreen();
    }
  }

  // 🔑 認証処理 (ログアウト)
  async function handleSignOut() {
    await supabaseClient.auth.signOut();
    currentUser = null;
    showAuthScreen();
  }

  function saveAccountData() {
    if (!currentUser) return;
    const rawUrl = document.getElementById('inAccUrl').value;
    const followers = document.getElementById('inFollowers').value || 0;
    const likes = document.getElementById('inLikes').value || 0;
    const videos = document.getElementById('inVideos').value || 0;

    let username = "@supnohe";
    if (rawUrl) {
      const match = rawUrl.match(/@([a-zA-Z0-9_\.\-]+)/);
      if (match) username = `@${match[1]}`;
    }

    const accData = { url: rawUrl, username, followers, likes, videos };
    localStorage.setItem(`my_tiktok_acc_${currentUser.id}`, JSON.stringify(accData));

    document.getElementById('accUsername').innerText = username;
    document.getElementById('accFollowers').innerText = Number(followers).toLocaleString();
    document.getElementById('accLikes').innerText = Number(likes).toLocaleString();
    document.getElementById('accVideos').innerText = Number(videos).toLocaleString();

    document.getElementById('accStatus').innerText = `✅ ${username} の情報を保存・更新しました！`;
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
      reader.readAsDataURL(file);
    });
  }

  async function addVideoFileKnowledge() {
    const fileInput = document.getElementById('refVideoFile');
    const file = fileInput.files[0];
    const status = document.getElementById('refStatus');

    if (!file) {
      alert("参考動画ファイルを選択してください！");
      return;
    }

    status.innerText = "⏳ AIが動画の映像（画角・動作・冒頭インパクト）を直接解析中...";

    try {
      const base64Data = await fileToBase64(file);

      const promptText = `
あなたはプロのSNS動画マーケターです。添付された参考バズ動画の「映像・音声・時間軸」を徹底的に分析し、以下のフォーマットで出力してください。

1行目: 動画タイトル（ファイル名や内容から15文字以内で自動命名）
2行目以降: 
【冒頭インパクト・動き出しの秒数】
・何秒目に動き出すか（例：0.5秒でダンス開始）
・冒頭のフック（文字テロップ、画角、ポーズ）

【画角・構図・テンポ】
・画角（全身、バストアップ、引きなど）
・カメラワークや編集テンポ

【バズ要素・構成の特徴】
・視聴者を惹きつける工夫やダンス・アクションの特徴
`;

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: promptText },
              { inline_data: { mime_type: file.type || "video/mp4", data: base64Data } }
            ]
          }]
        })
      });

      const data = await response.json();

      if (!data.candidates || !data.candidates[0]?.content?.parts?.[0]?.text) {
        throw new Error(data.error?.message || "AIからの分析結果を取得できませんでした。");
      }

      const aiText = data.candidates[0].content.parts[0].text;
      const titleMatch = aiText.split('\n')[0].replace('動画タイトル:', '').replace('タイトル:', '').trim();
      const autoTitle = titleMatch || `動画解析: ${file.name}`;

      // user_id を追加してログイン中のユーザーデータとして保存
      const { error: dbError } = await supabaseClient
        .from('reference_videos')
        .insert([{ title: autoTitle, features: aiText, user_id: currentUser.id }]);

      if (dbError) throw new Error(dbError.message);

      status.innerText = `✅ 映像のAI解析・ナレッジ蓄積が完了しました！（タイトル: ${autoTitle}）`;
      fileInput.value = "";

    } catch (error) {
      console.error(error);
      status.innerText = "❌ 解析・登録エラー: " + error.message;
    }
  }

  async function fetchTikTokMetaData(url) {
    const cleanUrl = url.split('?')[0];
    const apiUrl = `https://tiktok-downloader-download-tiktok-videos-without-watermark.p.rapidapi.com/rich_response/index?url=${encodeURIComponent(cleanUrl)}`;
    
    const response = await fetch(apiUrl, {
      method: 'GET',
      headers: {
        'x-rapidapi-key': RAPID_API_KEY,
        'x-rapidapi-host': 'tiktok-downloader-download-tiktok-videos-without-watermark.p.rapidapi.com'
      }
    });

    return await response.json();
  }

  async function addTikTokKnowledge() {
    const rawUrl = document.getElementById('tiktokUrl').value;
    const status = document.getElementById('refStatus');

    if (!rawUrl) {
      alert("TikTok URLを入力してください！");
      return;
    }

    status.innerText = "⏳ TikTokデータを解析中...";

    try {
      const metaData = await fetchTikTokMetaData(rawUrl);
      const originalTitle = metaData.title || metaData.description || metaData.data?.title || `TikTok参考動画 (${new Date().toLocaleDateString()})`;

      status.innerText = "⏳ AIがナレッジを抽出中...";

      const promptText = `
あなたはプロのSNS動画マーケターです。以下のTikTok動画メタデータをもとに、このバズ動画の特徴を簡潔にまとめてください。

【TikTokデータ】
${JSON.stringify(metaData, null, 2)}
`;

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }] }]
        })
      });

      const data = await response.json();
      const features = data.candidates[0].content.parts[0].text;

      // user_id を追加してログイン中のユーザーデータとして保存
      const { error: dbError } = await supabaseClient
        .from('reference_videos')
        .insert([{ title: originalTitle, features: features, user_id: currentUser.id }]);

      if (dbError) throw new Error(dbError.message);

      status.innerText = `✅ ナレッジ登録完了！ （タイトル: ${originalTitle}）`;
      document.getElementById('tiktokUrl').value = "";

    } catch (error) {
      console.error(error);
      status.innerText = "❌ 登録エラー: " + error.message;
    }
  }

  async function analyzeMyVideo() {
    const myFile = document.getElementById('myVideo').files[0];
    const resultBox = document.getElementById('resultBox');
    const adviceText = document.getElementById('adviceText');

    if (!myFile) {
      alert("自分の動画を選択してください！");
      return;
    }

    resultBox.style.display = "block";
    adviceText.innerText = "⏳ 過去の蓄積ナレッジを取得し、比較診断中...";

    try {
      // ログイン中ユーザーのデータのみを取得（RLS有効化のため自動でフィルタされます）
      const { data: dbData } = await supabaseClient.from('reference_videos').select('title, features');
      
      let knowledgeText = "";
      if (dbData && dbData.length > 0) {
        knowledgeText = dbData.map((item, index) => `【お手本データ${index+1}: ${item.title}】\n${item.features}`).join("\n\n");
      } else {
        knowledgeText = "（現在ナレッジDBは空です。一般的なバズ基準と比較します）";
      }

      const myBase64 = await fileToBase64(myFile);

      const promptText = `
あなたはプロのSNS動画マーケターです。
以下に登録されている【過去のお手本バズ動画ナレッジ】を基準として、添付された【自分の動画】を評価・診断してください。

【過去のお手本バズ動画ナレッジ】
${knowledgeText}

以下のフォーマット（記号・見出し）を一切変更せず、完全にその通りに出力してください。余計な前置きや後置きの挨拶は不要です。

1．冒頭の改善点
① [箇条書き1]
② [箇条書き2]
③ [箇条書き3]

改善策詳細
・[詳細説明1]
・[詳細説明2]

2．画角・秒数・テンポ
① [箇条書き1]
② [箇条書き2]
③ [箇条書き3]

改善策詳細
・[詳細説明1]
・[詳細説明2]

3．視覚効果・テキストテロップ・キャプション・ハッシュタグ
① [箇条書き1]
② [箇条書き2]
③ [箇条書き3]

改善策詳細
・[詳細説明1]
・[詳細説明2]
・おすすめハッシュタグ: #〇〇 #〇〇 #〇〇 #〇〇 #〇〇

4．次回の動画に向けての改善点まとめ
・[まとめ1]
・[まとめ2]
・[まとめ3]
・[まとめ4]
・[まとめ5]
`;

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: promptText },
              { inline_data: { mime_type: myFile.type || "video/mp4", data: myBase64 } }
            ]
          }]
        })
      });

      const data = await response.json();

      if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
        const rawAdvice = data.candidates[0].content.parts[0].text;
        adviceText.innerText = rawAdvice;

        // user_id を追加してログイン中のユーザーデータとして保存
        await supabaseClient.from('video_analyses').insert([
          {
            title: `単独動画診断 (${new Date().toLocaleString()})`,
            target_video_url: myFile.name,
            ai_advice: rawAdvice,
            user_id: currentUser.id
          }
        ]);
      } else {
        adviceText.innerText = "⚠️ AIからの回答取得に失敗しました。";
      }

    } catch (error) {
      console.error(error);
      adviceText.innerText = "❌ エラーが発生しました: " + error.message;
    }
  }
</script>

</body>
</html>
